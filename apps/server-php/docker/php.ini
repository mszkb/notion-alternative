; PHP settings of the backend image (ADR 0018).
expose_php = Off
; Attachment uploads are read whole (ATTACHMENT_MAX_MB, default 25) and imports are decoded whole
; (IMPORT_MAX_MB, default 50): see apps/server-php/README.md.
memory_limit = 512M
max_execution_time = 300
; PUT bodies are read from php://input; POST form parsing is not used.
post_max_size = 64M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
