# Frontend container: serves the SPA and passes /api to the PHP backend via FastCGI (ADR 0018).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 1m;
  server_tokens off;

  # Security headers live in a snippet: add_header in a location block
  # replaces all add_header directives inherited from the server block.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Re-resolve the backend via Docker's DNS: its IP can change when it restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # PHP-FPM of the backend container (ADR 0018); every /api request runs its front controller.
  set $php_upstream backend:9000;

  # Metrics are for internal scraping only (see docs/operations/deployment.md).
  location = /api/metrics {
    return 404;
  }

  # Attachment uploads may be larger than other API requests (ATTACHMENT_MAX_MB, ADR 0012).
  location /api/attachments/ {
    client_max_body_size 30m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    # Like proxy_add_x_forwarded_for: the server takes the last entry as client address (rate limits).
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_pass $php_upstream;
  }

  # Workspace import: one JSON body with the whole workspace (IMPORT_MAX_MB, ADR 0004).
  location = /api/import {
    client_max_body_size 50m;
    fastcgi_read_timeout 300s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    # Like proxy_add_x_forwarded_for: the server takes the last entry as client address (rate limits).
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_pass $php_upstream;
  }

  location /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    # Like proxy_add_x_forwarded_for: the server takes the last entry as client address (rate limits).
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_pass $php_upstream;
  }

  # Service worker: always revalidated, otherwise clients could stay on an old release.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # PWA manifest: correct type, revalidated so changes reach installed apps.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # App icons are not hashed; cache for a day.
  location /app-icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Hashed build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html must not be cached so new releases are picked up.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
