server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 1m;
  server_tokens off;

  # Security headers live in a snippet: add_header in a location block
  # replaces all add_header directives inherited from the server block.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Re-resolve the backend via Docker's DNS: its IP can change when it restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:3000;

  # Metrics are for internal scraping only (see docs/operations/deployment.md).
  location = /api/metrics {
    return 404;
  }

  # Attachment uploads may be larger than other API requests (ATTACHMENT_MAX_MB, ADR 0012).
  location /api/attachments/ {
    client_max_body_size 30m;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Workspace import: one JSON body with the whole workspace (IMPORT_MAX_MB, ADR 0004).
  location = /api/import {
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker: always revalidated, otherwise clients could stay on an old release.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # PWA manifest: correct type, revalidated so changes reach installed apps.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # App icons are not hashed; cache for a day.
  location /icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Hashed build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html must not be cached so new releases are picked up.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
