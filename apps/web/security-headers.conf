# Security headers for every response of the frontend (ADR 0010, #74). vite preview reads this
# file and the one it includes (vite.config.ts), so the PWA end-to-end tests run against the
# same policy.
include /etc/nginx/snippets/security-headers-base.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
