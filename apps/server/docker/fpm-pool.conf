; Pool settings on top of the official image (www pool, listen = 9000 in zz-docker.conf).
[www]
; Configuration comes from the container environment (DATA_DIR, ALLOW_REGISTRATION, S3_*, …).
clear_env = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Push hints are sent after the response (fastcgi_finish_request); keep workers bounded.
request_terminate_timeout = 310s
