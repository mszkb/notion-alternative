name: Android

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Replaces the APK of the `android-dev` pre-release.
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :core:jvmTest :shared:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk notion-alt-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: notion-alt-dev-apk
          path: apps/mobile/notion-alt-dev.apk
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: apps/mobile/**/build/reports/tests/
      # Pushes only (not pull requests): the pre-release always carries the latest build.
      - name: Update pre-release android-dev
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          notes="Debug-Build der Android-App (nicht für den Store). Commit ${GITHUB_SHA} auf ${GITHUB_REF_NAME}, $(date -u '+%Y-%m-%d %H:%M UTC'). Anleitung: apps/mobile/README.md"
          if gh release view android-dev --repo "$REPO" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/android-dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit android-dev --repo "$REPO" --prerelease --notes "$notes"
          else
            gh release create android-dev --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
              --title "Android Dev Build" --notes "$notes"
          fi
          gh release upload android-dev notion-alt-dev.apk --repo "$REPO" --clobber
