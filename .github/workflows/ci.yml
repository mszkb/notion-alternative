name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @notion-alt/web exec playwright install --with-deps chromium
      - name: End-to-end tests (offline cases T-OFF-01/02, editor)
        run: pnpm --filter @notion-alt/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Attachments on S3-compatible storage (#63), against a real server with signature checks.
  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start an S3-compatible server (SeaweedFS)
        run: |
          mkdir -p /tmp/s3
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"cikey","secretKey":"cisecret123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3/s3.json
          docker run -d --name s3 -p 9100:8333 -v /tmp/s3:/config chrislusf/seaweedfs server -volume.max=0 -s3 -s3.config=/config/s3.json
          for i in $(seq 1 90); do
            curl -s -o /dev/null -w '%{http_code}' http://localhost:9100/ | grep -qE '403|200' && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - name: S3 integration tests
        run: pnpm --filter @notion-alt/server exec vitest run test/s3.integration.test.ts
        env:
          S3_TEST_ENDPOINT: http://localhost:9100
          S3_TEST_ACCESS_KEY: cikey
          S3_TEST_SECRET_KEY: cisecret123

  backup:
    # T-BAK-01 (#75): back up the running stack, restore into an empty volume, verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backup and restore
        run: ./scripts/backup-restore-test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/ready
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
      - name: Logs
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

  # Reference device is a Raspberry Pi (linux/arm64), see ADR 0010.
  # Build only (no registry push, no secrets); the native SQLite binding is
  # loaded once under QEMU to catch a missing arm64 prebuild.
  docker-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/server/Dockerfile
          - image: frontend
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: false
          load: true
          tags: notion-alt-${{ matrix.image }}:arm64
          cache-from: type=gha,scope=arm64-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.image }}
      - name: Load better-sqlite3 on arm64
        if: matrix.image == 'backend'
        run: |
          docker run --rm --platform linux/arm64 notion-alt-backend:arm64 \
            node -e "const D = require('better-sqlite3'); console.log(process.arch, new D(':memory:').prepare('select sqlite_version() v').get())"
