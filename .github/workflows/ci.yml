name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The web app's integration tests and the contract tests run against the PHP server.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, curl, openssl, sodium
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: apps/server
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # HTTP contract of the server (docs/testing/contract-tests.md), the spec since #129.
      - run: pnpm --filter @notion-alt/contract-tests test
      - run: pnpm build

  # PHP server (ADR 0018): code style, static analysis and tests on the oldest and current PHP.
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, curl, openssl, sodium
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer cs
      - run: composer analyse
      - run: composer test
