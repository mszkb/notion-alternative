name: Site

# Builds the landing page and documentation (ADR 0025) on every change to them and publishes
# them to GitHub Pages from main. Repository setting: Pages → Source → GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'apps/site/**', 'pnpm-lock.yaml', '.github/workflows/site.yml']
  pull_request:
    paths: ['docs/**', 'apps/site/**', 'pnpm-lock.yaml', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @notion-alt/site
      # Fails on links to missing docs pages (scripts/sync-docs.mjs).
      - run: pnpm --filter @notion-alt/site build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
