services:
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:admin@localhost}
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-volume}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - data:/data

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only by default: put a TLS reverse proxy in front for remote access.
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
