services:
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - data:/data

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only by default: put a TLS reverse proxy in front for remote access.
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
