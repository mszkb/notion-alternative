services:
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:admin@localhost}
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-volume}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Empty means unset: the backend's defaults apply (apps/server/src/Config/ConfigLoader.php).
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-}
      WORKSPACE_STORAGE_MB: ${WORKSPACE_STORAGE_MB:-}
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-}
      LOGIN_MAX_FAILURES_PER_EMAIL: ${LOGIN_MAX_FAILURES_PER_EMAIL:-}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-}
      REGISTER_MAX_ATTEMPTS_PER_IP: ${REGISTER_MAX_ATTEMPTS_PER_IP:-}
    volumes:
      - data:/data
    # Hardening (#74): no root inside, no extra capabilities, nothing writable but /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only by default: put a TLS reverse proxy in front for remote access.
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    # nginx starts as root and drops to its worker user; it keeps only what it needs for that.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  data:
