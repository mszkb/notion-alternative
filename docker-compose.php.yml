# The PHP backend (PHP-FPM) instead of Node (ADR 0018, #128); the frontend speaks FastCGI to it.
#   docker compose -f docker-compose.yml -f docker-compose.php.yml up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: apps/server-php/Dockerfile

  frontend:
    build:
      args:
        NGINX_CONF: apps/web/nginx.php.conf
